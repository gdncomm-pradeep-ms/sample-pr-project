name: PR Quality Gates

on:
  pull_request:
    branches: [ 'main' ]
    types: [opened, synchronize, reopened]

concurrency:
  group: sonar-quality-gate-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  ANDROID_HOME: ${{ vars.ANDROID_HOME }}

jobs:
  release-build:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4

      - name: Assemble release build
        run: ./gradlew :app:assembleRelease

  sonar-quality-gate:
    needs: release-build
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Sonar analysis and enforce quality gate
        env:
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          ./gradlew sonar \
            -Dsonar.host.url="${SONAR_HOST_URL}" \
            -Dsonar.token="${SONAR_TOKEN}" \
            -Dsonar.projectKey=sample-pr-project-test \
            -Dsonar.projectName=sample-pr-project-test \
            -Dsonar.qualitygate.wait=true \
            -Dsonar.qualitygate.timeout=300
